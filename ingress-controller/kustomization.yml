apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ingress-controller.yml
  - ingress-configuration.yml
  - ClusterIssuer.yml

patches:
  - target:
      kind: Deployment
      name: rabbitmq-cluster-operator
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "0"
  - target:
      kind: Ingress
      name: rabbitmq
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
  - target:
      kind: ClusterIssuer
      name: create-queues
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "2"      
  
